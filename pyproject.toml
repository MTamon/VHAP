[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["vhap/**/*.py"]

[project]
name = "VHAP"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tyro",
    "pyyaml",
    "numpy==2.2.6",
    "matplotlib>=3.10,<3.11",
    "scipy",
    "pillow",
    "opencv-python",
    "ffmpeg-python",
    "colour-science",
    "torch>=2.9,<2.10",  # install from the CUDA 12.8 PyTorch index
    "torchvision>=0.24,<0.25",  # install from the CUDA 12.8 PyTorch index
    "tensorboard",
    "chumpy-fork==0.71",
    "trimesh",
    "nvdiffrast@git+https://github.com/ShenhanQian/nvdiffrast@backface-culling",
    "BackgroundMattingV2@git+https://github.com/ShenhanQian/BackgroundMattingV2",
    "STAR@git+https://github.com/ShenhanQian/STAR/",
    "dlib",  # for STAR
    "pandas",  # for STAR
    "gdown",  # for STAR
    "face-alignment",
    "dearpygui",
    "joblib"
]
authors = [
  {name = "Shenhan Qian", email = "shenhan.qian@tum.de"},
]

description = "A complete head tracking pipeline from videos to NeRF-ready datasets."
readme = "README.md"
